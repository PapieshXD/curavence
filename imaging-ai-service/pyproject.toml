[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ralek-imaging-ai-service"
version = "0.1.0"
description = "DICOM classification, quality control, segmentation and measurements for Ralek"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "wfdb>=4.2,<5",
  "pyedflib>=0.1.40,<0.2",
  "defusedxml>=0.7,<1",
  "neurokit2==0.3.0",
  "Pillow>=11,<14",
  "nibabel>=5.3,<6",
  "pydantic-settings>=2.7,<3",
  "pydicom>=3,<4",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
ci = ["ruff==0.17.5", "setuptools==84.2.1"]
segmentation = [
  "TotalSegmentator==2.18.0",
]
test = [
  "pytest>=8,<10",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv", "segmentation-test-venv", "preview-test-env"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
