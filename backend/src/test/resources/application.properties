spring.datasource.url=jdbc:h2:mem:ralek;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
ralek.realtime.enabled=false
ralek.storage.enabled=false
ralek.storage.endpoint=http://localhost:9000
ralek.storage.access-key=test
ralek.storage.secret-key=test-secret
ralek.storage.original-bucket=med-node-original
ralek.storage.derived-bucket=med-node-derived
ralek.storage.temp-bucket=med-node-temp
ralek.documents.max-upload-bytes=26214400
ralek.documents.max-pages=100
ralek.documents.max-extracted-characters=100000
ralek.documents.minimum-digital-text-characters=40
ralek.cors.allowed-origins=http://localhost:4200
ralek.keycloak.token-uri=http://localhost:8081/realms/med-node/protocol/openid-connect/token
ralek.keycloak.client-id=med-node-frontend
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/med-node
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/med-node/protocol/openid-connect/certs
ralek.imaging.provider=orthanc
ralek.imaging.orthanc-base-url=http://localhost:8042
ralek.imaging.orthanc-username=test
ralek.imaging.orthanc-password=test
ralek.imaging.ohif-base-url=http://127.0.0.1:3000
ralek.imaging.public-api-base-url=http://127.0.0.1:3000
ralek.imaging.viewer-session-ttl=PT10M
ralek.imaging.max-archive-entries=100

ralek.exports.worker-enabled=false
ralek.search.worker-enabled=false
