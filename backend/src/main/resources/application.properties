spring.application.name=backend
ralek.reading-guide.enabled=${READING_GUIDE_ENABLED:true}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/med_node}
spring.datasource.username=${DB_USERNAME:med_node}
spring.datasource.password=${DB_PASSWORD:med_node_dev}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=${IMAGING_MULTIPART_MAX_FILE_SIZE:4GB}
spring.servlet.multipart.max-request-size=${IMAGING_MULTIPART_MAX_REQUEST_SIZE:4GB}
server.forward-headers-strategy=framework

# Medical PDF upload and PDFBox extraction limits.
ralek.documents.max-upload-bytes=${DOCUMENT_MAX_UPLOAD_BYTES:26214400}
ralek.documents.max-pages=${DOCUMENT_MAX_PAGES:100}
ralek.documents.max-extracted-characters=${DOCUMENT_MAX_EXTRACTED_CHARACTERS:100000}
ralek.documents.minimum-digital-text-characters=${DOCUMENT_MIN_DIGITAL_TEXT_CHARACTERS:40}
ralek.documents.chat.enabled=${DOCUMENT_CHAT_ENABLED:true}
ralek.documents.chat.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ralek.documents.chat.path=/api/chat
ralek.documents.chat.model=${OLLAMA_DOCUMENT_MODEL:qwen3.5:4b}
ralek.documents.chat.max-context-characters=${DOCUMENT_CHAT_MAX_CONTEXT_CHARACTERS:60000}
ralek.documents.chat.connect-timeout=5s
ralek.documents.chat.read-timeout=120s

spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/med-node}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/med-node/protocol/openid-connect/certs}

ralek.keycloak.token-uri=${KEYCLOAK_TOKEN_URI:http://localhost:8081/realms/med-node/protocol/openid-connect/token}
ralek.keycloak.client-id=${KEYCLOAK_CLIENT_ID:med-node-frontend}
ralek.storage.enabled=${MINIO_ENABLED:true}
ralek.storage.endpoint=${MINIO_ENDPOINT:http://localhost:9100}
ralek.storage.access-key=${MINIO_ACCESS_KEY:med-node}
ralek.storage.secret-key=${MINIO_SECRET_KEY:med-node-secret}
ralek.storage.original-bucket=med-node-original
ralek.storage.derived-bucket=med-node-derived
ralek.storage.temp-bucket=med-node-temp
ralek.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://localhost:4202,http://127.0.0.1:4202,https://curavence.pl}

# DICOM archive and viewer. Orthanc credentials never leave the backend.
ralek.imaging.provider=${IMAGING_PROVIDER:orthanc}
ralek.imaging.orthanc-base-url=${ORTHANC_BASE_URL:http://localhost:8042}
ralek.imaging.orthanc-username=${ORTHANC_USERNAME:mednode}
ralek.imaging.orthanc-password=${ORTHANC_PASSWORD:mednode-orthanc-dev}
ralek.imaging.ohif-base-url=${OHIF_BASE_URL:http://127.0.0.1:3000}
ralek.imaging.public-api-base-url=${PUBLIC_API_BASE_URL:http://127.0.0.1:3000}
ralek.imaging.viewer-session-ttl=${VIEWER_SESSION_TTL:PT10M}
ralek.imaging.max-archive-entries=${IMAGING_MAX_ARCHIVE_ENTRIES:20000}
ralek.imaging.max-archive-uncompressed-bytes=${IMAGING_MAX_ARCHIVE_BYTES:4294967296}
ralek.imaging.max-archive-compression-ratio=${IMAGING_MAX_ARCHIVE_RATIO:100}
ralek.imaging.max-upload-bytes=${IMAGING_MAX_UPLOAD_BYTES:4294967296}
ralek.imaging.google.project-id=${GCP_PROJECT_ID:}
ralek.imaging.google.location=${GCP_HEALTHCARE_LOCATION:}
ralek.imaging.google.dataset-id=${GCP_HEALTHCARE_DATASET_ID:}
ralek.imaging.google.dicom-store-id=${GCP_DICOM_STORE_ID:}

# Medical imaging segmentation worker. The worker returns evidence and masks, never a diagnosis.
ralek.segmentation.enabled=${SEGMENTATION_ENABLED:true}
ralek.segmentation.base-url=${SEGMENTATION_BASE_URL:http://localhost:8090}
ralek.segmentation.service-token=${SEGMENTATION_SERVICE_TOKEN:med-node-segmentation-dev}
ralek.segmentation.connect-timeout=${SEGMENTATION_CONNECT_TIMEOUT:10s}
ralek.segmentation.read-timeout=${SEGMENTATION_READ_TIMEOUT:2h}
ralek.segmentation.max-artifact-bytes=${SEGMENTATION_MAX_ARTIFACT_BYTES:4294967296}
ralek.segmentation.fast=${SEGMENTATION_FAST:true}
ralek.segmentation.device=${SEGMENTATION_DEVICE:cpu}
ralek.segmentation.run-pathology-models=${SEGMENTATION_RUN_PATHOLOGY_MODELS:true}

# AI integration defaults: safe for local development, no GPU calls.
ralek.ai.enabled=false
ralek.ai.mock-mode=true
ralek.ai.provider=serverless-worker
ralek.ai.base-url=
ralek.ai.api-key=
ralek.ai.submit-path=/v1/tasks/explanations
ralek.ai.model=qwen3.5:4b
ralek.ai.callback-base-url=http://localhost:8080
ralek.ai.connect-timeout=5s
ralek.ai.read-timeout=60s

# Daily readiness features
ralek.exports.enabled=${EXPORTS_ENABLED:true}
ralek.search.enabled=${DOCUMENT_SEARCH_ENABLED:true}
ralek.account-console-url=${KEYCLOAK_ACCOUNT_CONSOLE_URL:http://localhost:8081/realms/med-node/account/}

# Local AI knowledge; disable without affecting original documents or visit plans.
ralek.knowledge.enabled=${PATIENT_KNOWLEDGE_ENABLED:true}
ralek.knowledge.poll-ms=${PATIENT_KNOWLEDGE_POLL_MS:30000}
