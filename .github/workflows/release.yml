name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a stable version on the default branch
        env:
          VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      full-history: true
  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with: {python-version: '3.11'}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - run: |
          mkdir -p reports
          python .github/scripts/install_tools.py trivy
      - name: Build, smoke test, vulnerability gate and SBOM for all images
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/release-images.sh
      - name: Authenticate only after every image passes
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish complete image set
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/push-images.sh
      - name: Release reports and SBOM
        if: always()
        id: reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-reports
          path: reports/
          retention-days: 30
      - if: always()
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: echo "Release reports and SBOM — $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
