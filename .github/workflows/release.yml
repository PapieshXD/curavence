name: Release images
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a stable version on the default branch
        env:
          VERSION: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD "refs/remotes/origin/$DEFAULT_BRANCH"
  checks:
    needs: validate
    uses: ./.github/workflows/checks.yml
    with:
      full-history: true
  images:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.11'}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: |
          mkdir -p reports
          python .github/scripts/install_tools.py trivy
      - name: Build, smoke test, vulnerability gate and SBOM for all images
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/release-images.sh
      - name: Authenticate only after every image passes
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish complete image set
        env:
          VERSION: ${{ github.ref_name }}
        run: bash .github/scripts/push-images.sh
      - name: Release reports and SBOM
        if: always()
        id: reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-reports
          path: reports/
          retention-days: 30
      - if: always()
        env:
          REPORT_URL: ${{ steps.reports.outputs.artifact-url }}
        run: echo "Release reports and SBOM — $REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
