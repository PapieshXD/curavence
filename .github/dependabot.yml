version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      actions: {patterns: ['*']}
  - package-ecosystem: maven
    directory: /backend
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      java: {patterns: ['*']}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      frontend: {patterns: ['*']}
  - package-ecosystem: pip
    directories: [/imaging-ai-service, /.github/quality]
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      python: {patterns: ['*']}
  - package-ecosystem: docker
    directories: [/backend, /frontend, /imaging-ai-service]
    schedule: {interval: weekly}
    open-pull-requests-limit: 1
    groups:
      images: {patterns: ['*']}
