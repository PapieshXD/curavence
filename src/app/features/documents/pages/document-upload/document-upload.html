<section class="work-panel upload-page">
  <header class="panel-header"><div><h2>Dodaj dokument</h2><p>PDF, JPG lub PNG do 20 MB</p></div></header>
  <div class="upload-zone"><app-icon name="document" [size]="26" /><strong>Wybierz plik z urządzenia</strong><input type="file" /></div>
  <button class="primary-button" type="button" (click)="submit()">Dodaj do weryfikacji</button>
</section>
