server {
  gzip_static always;
  gzip_proxied expired no-cache no-store private auth;
  gunzip on;
  listen 80 default_server;
  listen [::]:80 default_server;

  # Keep the session-scoped DICOMweb API on the OHIF origin. The viewer's
  # DICOM client then sends the HttpOnly session cookie without exposing it.
  location /api/v1/viewer/ {
    proxy_pass http://host.docker.internal:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri $uri/ /index.html;
    sub_filter_once on;
    sub_filter_types text/html;
    sub_filter 'src="/app-config.js"' 'src="/app-config.js?v=20260810-all-series-2"';
    add_header Cross-Origin-Resource-Policy same-origin;
  }

  # Configuration changes must not be masked by the browser or OHIF PWA cache.
  location = /app-config.js {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires -1;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
